<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 433" fill="none" class="fig" data-fig="knn-classifier" role="img" aria-labelledby="knn-title knn-desc">
<title id="knn-title">k-nearest-neighbour classification</title>
<desc id="knn-desc">A two-feature plane, x₁ and x₂ from 0 to 10 on equal scales, with 42 labelled training samples in three classes (A filled, B open, C ringed dot; A: 14 draws from a normal distribution centred at (2.9, 6.6), sd 1.15; B: 14 draws from a normal distribution centred at (6.8, 6.9), sd 1.15; C: 14 draws from a normal distribution centred at (5, 2.9), sd 1.2; seed 20261007). The query point (7.5, 4.4) is joined to its k = 5 nearest samples by Euclidean distance; the circle has radius d₅ = 1.85, the distance to the 5th neighbour. Majority vote A 0, B 3, C 2: predicted class B (k = 1 would predict C). Dither fills the region each class wins under 5-NN (B is left blank); its edge and the ink line are the decision boundary, traced to within 1 plotted unit. Distance ties go to the lower sample index, vote ties to the tied class with the nearest member.</desc>
