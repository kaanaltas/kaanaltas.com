<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 908 361" fill="none" class="fig" data-fig="neural-network" role="img" aria-labelledby="neural-network-title neural-network-desc">
<title id="neural-network-title">Neural network: raster input to softmax output</title>
<desc id="neural-network-desc">An 8 by 8 pixel input image is flattened into round input ports that feed two hidden layers of ReLU neurons through weighted connections; four output logits pass through a softmax block into a pixel bar chart of class probabilities, where the second class wins at 0.81. One highlighted signal path runs from an input row to the winning bar, and a forward pass travels along it layer by layer.</desc>
<style>[data-fig="neural-network"] .s{stroke:var(--fig-ink,#1342ff)}
[data-fig="neural-network"] .i{fill:var(--fig-ink,#1342ff)}
[data-fig="neural-network"] .fl{fill:var(--fig-lit,#ffffff)}
[data-fig="neural-network"] .f0{fill:var(--fig-50,#f4f5f9)}
[data-fig="neural-network"] .f1{fill:var(--fig-100,#e6ebff)}
[data-fig="neural-network"] .f2{fill:var(--fig-200,#b9c7fd)}
[data-fig="neural-network"] .f3{fill:var(--fig-300,#97acff)}
[data-fig="neural-network"] .g{stroke:var(--fig-400,#607ffd)}
[data-fig="neural-network"] .sp{stroke:var(--fig-lit,#ffffff)}
[data-fig="neural-network"] .w0{stroke-opacity:.22}
[data-fig="neural-network"] .w1{stroke-opacity:.6}
[data-fig="neural-network"] .dz{fill-opacity:.35}
[data-fig="neural-network"] .mu{fill-opacity:.6}
[data-fig="neural-network"] .t{font-family:'Departure Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.02em;text-transform:uppercase}
[data-fig="neural-network"] .pulse{display:none}
[data-fig="neural-network"] .pk{stroke-dasharray:18 400;stroke-dashoffset:20}
[data-fig="neural-network"] .ph{stroke-dasharray:7 400}
:where(.fig-frame) [data-fig="neural-network"] [data-part]{opacity:0;translate:0 calc(var(--lift,-40)*1px);transition:translate 820ms var(--spring-soft,cubic-bezier(.23,1,.32,1)) calc(var(--i)*110ms),opacity 400ms ease calc(var(--i)*110ms)}
.is-in [data-fig="neural-network"] [data-part],[data-fig="neural-network"].is-in [data-part]{opacity:1;translate:0 0}
.is-in [data-fig="neural-network"] .pulse,[data-fig="neural-network"].is-in .pulse{display:inline}
.is-in [data-fig="neural-network"] .pk,[data-fig="neural-network"].is-in .pk{animation:neural-network-fwd 3.6s cubic-bezier(.45,0,.55,1) calc(var(--k)*.9s + 1.2s) infinite}
@keyframes neural-network-fwd{0%{stroke-dashoffset:20}25%,100%{stroke-dashoffset:-100}}
[data-fig="neural-network"]{-webkit-tap-highlight-color:transparent}
[data-fig="neural-network"]:focus{outline:none}
[data-fig="neural-network"]:focus-visible{outline:2px solid var(--fig-ink,#1342ff);outline-offset:6px;border-radius:8px}
[data-fig="neural-network"] .nn-ro,[data-fig="neural-network"] .nn-key{opacity:0}
[data-fig="neural-network"] .nn-ro.on,[data-fig="neural-network"].nn-live:not(.nn-nokey) .nn-key{opacity:1}
[data-fig="neural-network"].nn-live .nn-eb{opacity:.3}
[data-fig="neural-network"].nn-live :is(.nn-hero,.pulse,.nn-wl),[data-fig="neural-network"].nn-live.nn-hide-hl .nn-hl{opacity:0}
[data-fig="neural-network"] :is(.nn-eb,.nn-hero,.pulse,.nn-wl,.nn-hl,.nn-key,.nn-ro){transition:opacity 420ms var(--ease-out,cubic-bezier(.23,1,.32,1))}
[data-fig="neural-network"].nn-live :is(.nn-eb,.nn-hero,.pulse,.nn-wl,.nn-hl,.nn-key,.nn-ro),[data-fig="neural-network"] .nn-ro.on{transition:opacity 220ms var(--ease-out,cubic-bezier(.23,1,.32,1))}
[data-fig="neural-network"] .nn-ro.sw{transition:opacity 90ms var(--ease-out,cubic-bezier(.23,1,.32,1))}
[data-fig="neural-network"].nn-snap :is(.nn-eb,.nn-hero,.pulse,.nn-wl,.nn-hl,.nn-key,.nn-ro){transition:none}</style>
