<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 616" fill="none" class="fig" data-fig="mccabe-thiele" role="img" aria-labelledby="mccabe-thiele-title mccabe-thiele-desc">
<title id="mccabe-thiele-title">McCabe–Thiele stage construction</title>
<desc id="mccabe-thiele-desc">McCabe–Thiele diagram for a binary distillation with constant relative volatility α = 2.5. The hero curve is the equilibrium line y = αx / (1 + (α − 1)x); the thin diagonal is y = x. Feed: z_F = 0.5, q = 0.6 (60 % liquid), so the q-line through (z_F, z_F) has slope q/(q − 1) = −1.50 and meets the equilibrium curve at the pinch (0.410, 0.635), which gives R_min = 1.180. At R = 1.4 R_min = 1.653 the rectifying operating line runs from (x_D, x_D) = (0.9, 0.9) with slope R/(R + 1) = 0.623 to its intersection with the q-line at (0.429, 0.607); the stripping line runs from there to (x_B, x_B) = (0.1, 0.1). Stepping from the top, alternately horizontal to the equilibrium curve and vertical to the active operating line, switching at the feed stage, gives 9 theoretical stages (8.97 by fractional count, reboiler included), with stage 5 as the optimal feed stage. The stair region is rasterised onto the grid underneath the exact vector staircase.</desc>
