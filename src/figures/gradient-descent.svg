<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 350" fill="none" class="fig" data-fig="gradient-descent" role="img" aria-labelledby="gradient-descent-title gradient-descent-desc">
<title id="gradient-descent-title">Gradient descent on a loss landscape</title>
<desc id="gradient-descent-desc">Exploded isometric view. A quadratic loss surface L(θ), drawn as a mesh with banded level sets, floats above the parameter space θ, where the same level sets appear rasterised into pixel-stepped dither bands. Starting at θ₀, gradient descent takes the exact updates θₖ₊₁ = θₖ − η∇L(θₖ): each step runs opposite the gradient ∇L(θ₀), drawn perpendicular to the level set through θ₀, zig-zagging across the steep valley walls and converging into the minimum.</desc>
<style>[data-fig="gradient-descent"] .s{stroke:var(--fig-ink,#1342ff)}[data-fig="gradient-descent"] .i{fill:var(--fig-ink,#1342ff)}[data-fig="gradient-descent"] .fl{fill:var(--fig-lit,#fff)}[data-fig="gradient-descent"] .f0{fill:var(--fig-50,#f4f5f9)}[data-fig="gradient-descent"] .f1{fill:var(--fig-100,#e6ebff)}[data-fig="gradient-descent"] .f2{fill:var(--fig-200,#b9c7fd)}[data-fig="gradient-descent"] .f3{fill:var(--fig-300,#97acff)}[data-fig="gradient-descent"] .g{stroke:var(--fig-400,#607ffd)}
[data-fig="gradient-descent"] path{stroke-linecap:butt;stroke-linejoin:miter}[data-fig="gradient-descent"] text{font-family:'Departure Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.02em}[data-fig="gradient-descent"] .d{fill-opacity:.35}[data-fig="gradient-descent"] .ball{opacity:0}
:where(.fig-frame) [data-fig="gradient-descent"] [data-part]{opacity:0;translate:0 calc(var(--lift,-40)*1px);transition:translate 820ms var(--spring-soft,cubic-bezier(.23,1,.32,1)) calc(var(--i)*110ms),opacity 400ms ease calc(var(--i)*110ms)}
.is-in [data-fig="gradient-descent"] [data-part],[data-fig="gradient-descent"].is-in [data-part]{opacity:1;translate:0 0}
.is-in [data-fig="gradient-descent"] .ball,[data-fig="gradient-descent"].is-in .ball{animation:4s linear 1.4s infinite}
.is-in [data-fig="gradient-descent"] .ball-s,[data-fig="gradient-descent"].is-in .ball-s{animation-name:gradient-descent-hop}
.is-in [data-fig="gradient-descent"] .ball-p,[data-fig="gradient-descent"].is-in .ball-p{animation-name:gradient-descent-shadow}
