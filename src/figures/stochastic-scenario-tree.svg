<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 461" fill="none" class="fig" data-fig="stochastic-scenario-tree" role="img" aria-labelledby="stochastic-scenario-tree-title stochastic-scenario-tree-desc">
<title id="stochastic-scenario-tree-title">Two-stage stochastic program: scenario tree with recourse</title>
<desc id="stochastic-scenario-tree-desc">Two-stage stochastic program min cᵀx + Σ p_s Q(x, ξ_s), drawn as a scenario tree. The first-stage decision x (installed capacity: PV 2.5 MW, wind 1.5 MW, battery 2 MWh, shown as pixel bars in a double-rimmed node) is a single node shared by every scenario, which is non-anticipativity. It fans out to four renewable-availability scenarios with probabilities sunny 0.35, windy 0.30, cloudy 0.25, calm 0.10 (sum 1.00). Each scenario card is a 24-hour sparkline of available renewable output (PV plus wind, MW) in 0.4 MW pixel steps, with the flat 1 MW load as a dotted line. The recourse y_s is the hourly dispatch: surplus charges the battery (90% efficient), deficits discharge it, and the rest is imported at 100 EUR/MWh. Q(x, ξ_s) is that import cost in thousand EUR per day (0.82, 0.23, 0.65, 1.73), and the probability-weighted bracket gives E[Q(x, ξ)] = 0.69.</desc>
<style>[data-fig="stochastic-scenario-tree"] .s{stroke:var(--fig-ink,#1342ff)}
[data-fig="stochastic-scenario-tree"] .sl{stroke:var(--fig-lit,#ffffff)}
[data-fig="stochastic-scenario-tree"] .i{fill:var(--fig-ink,#1342ff)}
[data-fig="stochastic-scenario-tree"] .iq{fill:var(--fig-400,#607ffd)}
[data-fig="stochastic-scenario-tree"] .fl{fill:var(--fig-lit,#ffffff)}
[data-fig="stochastic-scenario-tree"] .f0{fill:var(--fig-50,#f4f5f9)}
[data-fig="stochastic-scenario-tree"] .f1{fill:var(--fig-100,#e6ebff)}
[data-fig="stochastic-scenario-tree"] .f2{fill:var(--fig-200,#b9c7fd)}
[data-fig="stochastic-scenario-tree"] .f3{fill:var(--fig-300,#97acff)}
[data-fig="stochastic-scenario-tree"] .g{stroke:var(--fig-400,#607ffd)}
[data-fig="stochastic-scenario-tree"] .dz{fill-opacity:.35}
[data-fig="stochastic-scenario-tree"] .t{font-family:'Departure Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.02em}
[data-fig="stochastic-scenario-tree"] .sb{font-size:8px;baseline-shift:sub}
[data-fig="stochastic-scenario-tree"] .su{font-size:8px;baseline-shift:super}
[data-fig="stochastic-scenario-tree"] .pulse{display:none}
[data-fig="stochastic-scenario-tree"] .pk{stroke-dasharray:5 400;stroke-dashoffset:5}
:where(.fig-frame) [data-fig="stochastic-scenario-tree"] [data-part]{opacity:0;translate:0 calc(var(--lift,-40)*1px);transition:translate 820ms var(--spring-soft,cubic-bezier(.23,1,.32,1)) calc(var(--i)*110ms),opacity 400ms ease calc(var(--i)*110ms)}
.is-in [data-fig="stochastic-scenario-tree"] [data-part],[data-fig="stochastic-scenario-tree"].is-in [data-part]{opacity:1;translate:0 0}
.is-in [data-fig="stochastic-scenario-tree"] .pulse,[data-fig="stochastic-scenario-tree"].is-in .pulse{display:inline}
.is-in [data-fig="stochastic-scenario-tree"] .pk,[data-fig="stochastic-scenario-tree"].is-in .pk{animation:stochastic-scenario-tree-go 4s cubic-bezier(.45,0,.55,1) calc(var(--k)*1s + 1.2s) infinite}
@keyframes stochastic-scenario-tree-go{0%{stroke-dashoffset:5;opacity:0}3%{opacity:1}22%{opacity:1}25%,100%{stroke-dashoffset:-100;opacity:0}}
[data-fig="stochastic-scenario-tree"] .sst-cov,[data-fig="stochastic-scenario-tree"] .sst-key,[data-fig="stochastic-scenario-tree"] .sst-far{opacity:0;transition:opacity 280ms cubic-bezier(.23,1,.32,1)}
[data-fig="stochastic-scenario-tree"].sst-live .sst-cov,[data-fig="stochastic-scenario-tree"].sst-live.sst-has-cov .sst-key,[data-fig="stochastic-scenario-tree"].sst-live.sst-far-on .sst-far{opacity:1;transition-duration:200ms}
[data-fig="stochastic-scenario-tree"].sst-cut .sst-cov,[data-fig="stochastic-scenario-tree"].sst-cut .sst-key,[data-fig="stochastic-scenario-tree"].sst-cut .sst-far{transition:none}
svg[data-fig="stochastic-scenario-tree"]{outline:none;-webkit-tap-highlight-color:transparent}
svg[data-fig="stochastic-scenario-tree"]:focus-visible{outline:2px solid var(--fig-ink,#1342ff);outline-offset:6px;border-radius:8px}</style>
