<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none" class="fig" data-fig="compass-construction" data-replay="" role="img" aria-labelledby="compass-construction-title compass-construction-desc">
  <title id="compass-construction-title">Compass: the construction of the KA monogram</title>
  <desc id="compass-construction-desc">Construction board of the KA monogram. The K's leg is a circular arc centred on the A's apex; it runs on through the A as its crossbar. The apex and the K's joint are the ends of a 3-4-5 right triangle, four strokes across along the cap line and three down the stem's axis, so the hypotenuse, five strokes, is the compass radius of the arc's centreline; the arc's inner and outer circles are 26 units apart. The arm leaves the joint along a 3:4 line, the mirror of the arc's start. Dotted axes, dashed cap line, baseline and centreline, solid primary construction and hollow anchor nodes at the apex, the joint, the cap-line corner, the arm's top, the A's inner apex, the crossbar on the axis and the outer corners.</desc>
  <style>
    [data-fig="compass-construction"] { shape-rendering: geometricPrecision; }
    [data-fig="compass-construction"] .s { stroke: var(--fig-ink, #1342ff); stroke-width: 1; stroke-linecap: butt; stroke-linejoin: miter; }
    [data-fig="compass-construction"] .g { stroke: var(--fig-400, #607ffd); stroke-width: 1; stroke-linecap: butt; }
    [data-fig="compass-construction"] .fl { fill: var(--fig-lit, #ffffff); }
    [data-fig="compass-construction"] .f1 { fill: var(--fig-100, #e6ebff); }
    [data-fig="compass-construction"] .aux { stroke-dasharray: 1 3; }
    [data-fig="compass-construction"] .sec { stroke-dasharray: 6 4; }
    [data-fig="compass-construction"] .dr { stroke-dasharray: 1 1; }
    [data-fig="compass-construction"] .t-aux { opacity: .55; }
    [data-fig="compass-construction"] .t-sec { opacity: .75; }
    [data-fig="compass-construction"] .t-pri { opacity: .5; }
    [data-fig="compass-construction"] .anc { transform-box: fill-box; transform-origin: center; }
    /* The reveal, once, when the frame gets .is-in: transitions, so moving the figure (Quick Look) never replays it. */
    [data-fig="compass-construction"] :is(.t-aux, .t-sec, .t-pri) { transition: opacity 700ms cubic-bezier(.77,0,.175,1) 2050ms; }
    [data-fig="compass-construction"] .aux { transition: opacity 320ms cubic-bezier(.23,1,.32,1) calc(var(--i) * 80ms); }
    [data-fig="compass-construction"] .sec { transition: opacity 360ms cubic-bezier(.23,1,.32,1) calc(250ms + var(--i) * 90ms); }
    [data-fig="compass-construction"] .pri { transition: stroke-dashoffset 520ms cubic-bezier(.23,1,.32,1) calc(500ms + var(--i) * 100ms), opacity 1ms linear calc(500ms + var(--i) * 100ms); }
    [data-fig="compass-construction"] .tick { transition: opacity 260ms ease 1000ms; }
    [data-fig="compass-construction"] .anc { transition: scale 520ms var(--spring-bounce, cubic-bezier(.34,1.56,.64,1)) calc(1050ms + var(--i) * 45ms), opacity 160ms ease calc(1050ms + var(--i) * 45ms); }
    [data-fig="compass-construction"] .out { transition: stroke-dashoffset 760ms cubic-bezier(.77,0,.175,1) 1250ms; }
    [data-fig="compass-construction"] .ink { transition: opacity 460ms cubic-bezier(.23,1,.32,1) 1900ms; }
    :where(.fig-frame) [data-fig="compass-construction"] :is(.t-aux, .t-sec, .t-pri) { opacity: 1; }
    :where(.fig-frame) [data-fig="compass-construction"] .rv { opacity: 0; }
    :where(.fig-frame) [data-fig="compass-construction"] .dr { stroke-dashoffset: 1; }
    :where(.fig-frame) [data-fig="compass-construction"] .anc { scale: 0; }
    .is-in [data-fig="compass-construction"] .t-aux, [data-fig="compass-construction"].is-in .t-aux { opacity: .55; }
    .is-in [data-fig="compass-construction"] .t-sec, [data-fig="compass-construction"].is-in .t-sec { opacity: .75; }
    .is-in [data-fig="compass-construction"] .t-pri, [data-fig="compass-construction"].is-in .t-pri { opacity: .5; }
    .is-in [data-fig="compass-construction"] .rv, [data-fig="compass-construction"].is-in .rv { opacity: 1; }
    .is-in [data-fig="compass-construction"] .dr, [data-fig="compass-construction"].is-in .dr { stroke-dashoffset: 0; }
    .is-in [data-fig="compass-construction"] .anc, [data-fig="compass-construction"].is-in .anc { scale: 1; }
    [data-fig="compass-construction"] :is(.lv, .lv-g) { display: none; }
    [data-fig="compass-construction"][data-lv] :is(.ink, .out) { visibility: hidden; }
    [data-fig="compass-construction"][data-lv="draw"] :is(.lv-draw, .lv-g),
    [data-fig="compass-construction"][data-lv="guides"] .lv-g,
    [data-fig="compass-construction"][data-lv="redraw"] .lv-rd { display: inline; }
    [data-fig="compass-construction"][data-lv="guides"] :is(.ink, .out) { visibility: visible; }
    [data-fig="compass-construction"] .lv-g { opacity: 0; }
    [data-fig="compass-construction"] .lv-arm { stroke-width: 1.5; }
    [data-fig="compass-construction"] :is(.lv-turn, .lv-sw) { transform-box: view-box; transform-origin: 0 0; }
  </style>
