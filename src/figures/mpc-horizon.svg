<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" fill="none" class="fig" data-fig="mpc-horizon" role="img" aria-labelledby="mpc-horizon-title mpc-horizon-desc">
<title id="mpc-horizon-title">Model predictive control: the receding horizon</title>
<desc id="mpc-horizon-desc">Two stacked time plots split by a vertical line at the current sample k. Upper plot: the measured output y of the first-order plant y[t+1] = 0.8 y[t] + 0.2 u[t], steady at 0.2 until the set-point steps to 1 at k-3, then rising; to the right of k, the dashed reference r = 1 and the predicted output y-hat(k+i|k) over a prediction horizon of Np = 10 samples, which is the model rolled out on the planned inputs. Lower plot: past inputs as zero-order-hold bars, then the plan from the quadratic cost sum (y-hat - r)^2 + 8 sum du^2 with control horizon Nc = 4: four shrinking upward moves, held constant afterwards. Only the first move, u(k), is applied; at the next sample the window shifts one step and the problem is solved again.</desc>
<style>[data-fig="mpc-horizon"] .s{stroke:var(--fig-ink,#1342ff)}
[data-fig="mpc-horizon"] .i{fill:var(--fig-ink,#1342ff)}
[data-fig="mpc-horizon"] .fl{fill:var(--fig-lit,#ffffff)}
[data-fig="mpc-horizon"] .f0{fill:var(--fig-50,#f4f5f9)}
[data-fig="mpc-horizon"] .f1{fill:var(--fig-100,#e6ebff)}
[data-fig="mpc-horizon"] .f2{fill:var(--fig-200,#b9c7fd)}
[data-fig="mpc-horizon"] .f3{fill:var(--fig-300,#97acff)}
[data-fig="mpc-horizon"] .g{stroke:var(--fig-400,#607ffd)}
[data-fig="mpc-horizon"] path{stroke-linecap:butt;stroke-linejoin:miter}
[data-fig="mpc-horizon"] text{font-family:'Departure Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.02em}
[data-fig="mpc-horizon"] .mpc-horizon-ghost{opacity:0}
:where(.fig-frame) [data-fig="mpc-horizon"] [data-part]{opacity:0;translate:0 calc(var(--lift,-40)*1px);transition:translate 820ms var(--spring-soft,cubic-bezier(.23,1,.32,1)) calc(var(--i)*110ms),opacity 400ms ease calc(var(--i)*110ms)}
.is-in [data-fig="mpc-horizon"] [data-part],[data-fig="mpc-horizon"].is-in [data-part]{opacity:1;translate:0 0}
.is-in [data-fig="mpc-horizon"] .mpc-horizon-ghost,[data-fig="mpc-horizon"].is-in .mpc-horizon-ghost{animation:mpc-horizon-recede 3.2s cubic-bezier(.65,0,.35,1) 1.4s infinite}
@keyframes mpc-horizon-recede{0%{translate:0 0;opacity:0}12%{translate:0 0;opacity:1}58%{translate:40px 0;opacity:1}80%{translate:40px 0;opacity:0}100%{translate:40px 0;opacity:0}}
[data-fig="mpc-horizon"] .mpc-co{transition:opacity 240ms var(--ease-out,cubic-bezier(.23,1,.32,1)) 120ms}
[data-fig="mpc-horizon"] .mpc-co.off{opacity:0;transition:opacity 90ms var(--ease-out,cubic-bezier(.23,1,.32,1))}
[data-fig="mpc-horizon"] .mpc-ghost-w{transition:opacity 320ms var(--ease-out,cubic-bezier(.23,1,.32,1))}
[data-fig="mpc-horizon"].mpc-live .mpc-ghost-w{opacity:0;transition:opacity 140ms var(--ease-out,cubic-bezier(.23,1,.32,1))}
[data-fig="mpc-horizon"].mpc-ready{cursor:col-resize;-webkit-tap-highlight-color:transparent}
[data-live="hover"] [data-fig="mpc-horizon"].mpc-ready{cursor:inherit}
[data-fig="mpc-horizon"]:focus{outline:none}
[data-fig="mpc-horizon"]:focus-visible{outline:2px solid var(--fig-ink,#1342ff);outline-offset:6px;border-radius:8px}</style>
