<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 405" fill="none" class="fig" data-fig="milp-lattice" role="img" aria-labelledby="milp-lattice-title milp-lattice-desc">
  <title id="milp-lattice-title">MILP: a relaxation, an integer cut, and a proof</title>
  <desc id="milp-lattice-desc">Integer program: maximize cᵀx = 4x₁ + 3x₂ over integer x₁, x₂ subject to x₁ ≥ 1, x₂ ≥ 1, x₁ + x₂ ≥ 4, 3x₁ + x₂ ≤ 19, x₁ + 3x₂ ≤ 19 and x₁ ≤ 5.5. The hatched hexagon is the LP relaxation, with vertices (1, 3), (1, 6), (4.75, 4.75), (5.5, 2.5), (5.5, 1) and (3, 1); its hollow optimum is the vertex (4.75, 4.75) with bound 33.25. Solid dots are the 22 feasible integer points, faint dots are infeasible ones; the ringed integer optimum is (5, 4) with value 32. The dashed Chvátal–Gomory cut x₁ + x₂ ≤ 9, the sum of the two ≤ 19 rows divided by 4 and rounded down, passes through (4, 5) and (5, 4), keeps every feasible integer point and removes the dithered wedge that holds the LP optimum. The faint dashed iso-objective line cᵀx = 33.25 touches the relaxation only at the LP optimum; the objective arrow c = (4, 3) stands perpendicular to it and points toward increasing cᵀx. Branch and bound on x₁ = 4.75: the child x₁ ≤ 4 has LP optimum (4, 5) with value 31, the child x₁ ≥ 5 has LP optimum (5, 4) with value 32; both are integral, so 32 is optimal and the gap to 33.25 is closed.</desc>
  <style>
    [data-fig="milp-lattice"] { shape-rendering: geometricPrecision; }
    [data-fig="milp-lattice"] .s { stroke: var(--fig-ink, #1342ff); stroke-width: 1; stroke-linecap: butt; stroke-linejoin: miter; }
    [data-fig="milp-lattice"] .i { fill: var(--fig-ink, #1342ff); }
    [data-fig="milp-lattice"] .fl { fill: var(--fig-lit, #ffffff); }
    [data-fig="milp-lattice"] .f1 { fill: var(--fig-100, #e6ebff); }
    [data-fig="milp-lattice"] .f2 { fill: var(--fig-200, #b9c7fd); }
    [data-fig="milp-lattice"] .g { stroke: var(--fig-400, #607ffd); stroke-width: 1; stroke-linecap: butt; stroke-linejoin: miter; }
    [data-fig="milp-lattice"] .hatch { fill: url(#milp-lattice-hatch); fill-opacity: .22; }
    [data-fig="milp-lattice"] .dither { fill: url(#milp-lattice-d25); fill-opacity: .35; }
    [data-fig="milp-lattice"] .outside { fill-opacity: .4; }
    [data-fig="milp-lattice"] .inside { fill-opacity: .9; }
    [data-fig="milp-lattice"] .dash { stroke-dasharray: 4 4; }
    [data-fig="milp-lattice"] .hero { stroke-width: 2; }
    [data-fig="milp-lattice"] text { font-family: 'Departure Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: .02em; }
    [data-fig="milp-lattice"] .sup { font-size: 8px; baseline-shift: super; }
    :where(.fig-frame) [data-fig="milp-lattice"] [data-part] { opacity: 0; translate: 0 calc(var(--lift, -40) * 1px); transition: translate 820ms var(--spring-soft, cubic-bezier(.23,1,.32,1)) calc(var(--i)*110ms), opacity 400ms ease calc(var(--i)*110ms); }
    .is-in [data-fig="milp-lattice"] [data-part], [data-fig="milp-lattice"].is-in [data-part] { opacity: 1; translate: 0 0; }
    .is-in [data-fig="milp-lattice"] .cut-line, [data-fig="milp-lattice"].is-in .cut-line { animation: milp-lattice-cut 3.2s linear 1.4s infinite; }
    @keyframes milp-lattice-cut { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -8; } }
    [data-fig="milp-lattice"] .ml-fx { opacity: 0; transition: opacity 200ms cubic-bezier(.23,1,.32,1); }
    [data-fig="milp-lattice"] .ml-fx.on { opacity: 1; }
    [data-fig="milp-lattice"] .ml-co { transition: opacity 260ms cubic-bezier(.23,1,.32,1) 140ms; }
    [data-fig="milp-lattice"] .ml-co.out { opacity: 0; transition: opacity 140ms cubic-bezier(.23,1,.32,1); }
    [data-fig="milp-lattice"] .ml-ro { opacity: 0; transition: opacity 160ms cubic-bezier(.23,1,.32,1); }
    [data-fig="milp-lattice"].ml-live .ml-ro { opacity: 1; transition: opacity 240ms cubic-bezier(.23,1,.32,1) 60ms; }
    [data-fig="milp-lattice"] .cut-line { transition: stroke-width 200ms cubic-bezier(.23,1,.32,1); }
    [data-fig="milp-lattice"] .cut-line.ml-hot { stroke-width: 2; }
    [data-fig="milp-lattice"].ml-instant .ml-fx, [data-fig="milp-lattice"].ml-instant .ml-co, [data-fig="milp-lattice"].ml-instant .ml-ro, [data-fig="milp-lattice"].ml-instant .cut-line { transition: none !important; }
    svg[data-fig="milp-lattice"] { outline: none; -webkit-tap-highlight-color: transparent; }
    svg[data-fig="milp-lattice"]:focus-visible { outline: 2px solid var(--fig-ink, #1342ff); outline-offset: -6px; border-radius: 8px; }  /* inside the art: clear of the frame tag, >= 9 from every label */
